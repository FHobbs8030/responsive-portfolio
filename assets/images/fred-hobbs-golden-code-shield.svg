<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 128 144"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Fred Hobbs Golden Code Shield</title>
  <desc id="desc">
    Animated navy and metallic-gold developer shield with a code symbol and moving shine.
  </desc>

  <defs>
    <linearGradient id="goldEdge" x1="18" y1="18" x2="108" y2="126" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4b0"/>
      <stop offset="0.18" stop-color="#fbbf24"/>
      <stop offset="0.46" stop-color="#ea580c"/>
      <stop offset="0.72" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fff1a8"/>
    </linearGradient>

    <linearGradient id="steelEdge" x1="22" y1="20" x2="102" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8aa4c1"/>
      <stop offset="0.45" stop-color="#314a67"/>
      <stop offset="1" stop-color="#14283d"/>
    </linearGradient>

    <radialGradient id="core" cx="48%" cy="34%" r="72%">
      <stop offset="0" stop-color="#17314d"/>
      <stop offset="0.55" stop-color="#0c2034"/>
      <stop offset="1" stop-color="#07131f"/>
    </radialGradient>

    <linearGradient id="codeGold" x1="35" y1="50" x2="92" y2="91" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff0a2"/>
      <stop offset="0.28" stop-color="#fbbf24"/>
      <stop offset="0.62" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ffd666"/>
    </linearGradient>

    <linearGradient id="shineGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#fff7cf" stop-opacity="0.08"/>
      <stop offset="0.52" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.56" stop-color="#fff1a8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="goldGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.6" result="blur"/>
      <feColorMatrix
        in="blur"
        type="matrix"
        values="
          1 0 0 0 0.96
          0 0.55 0 0 0.38
          0 0 0.10 0 0.03
          0 0 0 1 0
        "
      />
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>

    <clipPath id="shieldClip">
      <path d="M64 6 112 27v39c0 31-18.5 55-48 70C34.5 121 16 97 16 66V27L64 6Z"/>
    </clipPath>
  </defs>

  <style>
    .shield-logo {
      transform-origin: 64px 72px;
      animation: shieldBreath 6s ease-in-out infinite;
    }

    .outer-glow {
      opacity: 0.42;
      animation: glowPulse 6s ease-in-out infinite;
    }

    .shine {
      transform: translateX(-92px) skewX(-18deg);
      animation: metallicSweep 6.5s ease-in-out infinite;
    }

    .code-mark {
      transform-origin: 64px 72px;
      animation: codePulse 6s ease-in-out infinite;
    }

    @keyframes metallicSweep {
      0%, 12% {
        transform: translateX(-92px) skewX(-18deg);
        opacity: 0;
      }
      20% {
        opacity: 0.85;
      }
      37% {
        transform: translateX(158px) skewX(-18deg);
        opacity: 0;
      }
      100% {
        transform: translateX(158px) skewX(-18deg);
        opacity: 0;
      }
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.30; }
      50% { opacity: 0.58; }
    }

    @keyframes shieldBreath {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.012); }
    }

    @keyframes codePulse {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(251, 191, 36, 0.30)); }
      50% { filter: drop-shadow(0 0 5px rgba(251, 191, 36, 0.68)); }
    }

    @media (prefers-reduced-motion: reduce) {
      .shield-logo,
      .outer-glow,
      .shine,
      .code-mark {
        animation: none !important;
      }
    }
  </style>

  <g class="shield-logo">
    <path
      class="outer-glow"
      d="M64 6 112 27v39c0 31-18.5 55-48 70C34.5 121 16 97 16 66V27L64 6Z"
      fill="none"
      stroke="#f59e0b"
      stroke-width="8"
      filter="url(#goldGlow)"
    />

    <path
      d="M64 6 112 27v39c0 31-18.5 55-48 70C34.5 121 16 97 16 66V27L64 6Z"
      fill="url(#core)"
      stroke="url(#goldEdge)"
      stroke-width="4"
      stroke-linejoin="round"
    />

    <path
      d="M64 14 104 31v34c0 26.3-15.2 47.3-40 60.7C39.2 112.3 24 91.3 24 65V31l40-17Z"
      fill="none"
      stroke="url(#steelEdge)"
      stroke-width="2.2"
      stroke-linejoin="round"
    />

    <path
      d="M64 22 95 35v29c0 21.4-11.3 38.7-31 50.2C44.3 102.7 33 85.4 33 64V35l31-13Z"
      fill="none"
      stroke="#f59e0b"
      stroke-opacity="0.28"
      stroke-width="1.2"
    />

    <g class="code-mark" fill="none" stroke="url(#codeGold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M48 53 33 68l15 15"/>
      <path d="M80 53 95 68 80 83"/>
      <path d="M70 47 58 89"/>
    </g>

    <path d="M43 103h42" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
    <path d="M51 109h26" stroke="#8aa4c1" stroke-width="1.4" stroke-linecap="round" opacity="0.48"/>

    <g clip-path="url(#shieldClip)">
      <rect
        class="shine"
        x="-56"
        y="-16"
        width="38"
        height="180"
        fill="url(#shineGradient)"
      />
    </g>

    <path
      d="M23 31 64 12l41 18"
      fill="none"
      stroke="#fff5c4"
      stroke-width="1.5"
      stroke-linecap="round"
      opacity="0.72"
    />
  </g>
</svg>
